<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IBVAP &mdash; Tactical Operations Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="/static/css/main.css" />
  <style>
    .dash-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg, #0a0f1a);
    }
    .dash-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .dash-top__brand {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .dash-top__brand small {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      font-weight: 500;
    }
    .dash-top__user {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--dim);
    }
    .dash-top__user .pill {
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 10px;
    }
    .dash-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px 20px;
    }
    .video-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .video-hero__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(10,15,26,0.95);
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .video-hero__title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-weight: 600;
    }
    .video-hero__frame {
      width: 100%;
      height: 540px;
      background: #02050b;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .video-hero__frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .cams-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .cam-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 150ms ease;
    }
    .cam-card:hover {
      border-color: var(--accent);
    }
    .cam-card__head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
    }
    .cam-card__img-wrap {
      width: 100%;
      height: 120px;
      background: #050914;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .cam-card__img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cam-card__stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
    }
    .cam-card__stat {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .cam-card__stat .lbl { color: var(--dim); font-size: 8px; text-transform: uppercase; }
    .cam-card__stat .val { color: var(--text); }
    .nav-links {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .nav-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 4px;
      text-decoration: none;
      transition: all 120ms ease;
    }
    .nav-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }
    .nav-btn.primary {
      background: rgba(46, 125, 209, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="access-denied-bar"></div>

  <div class="dash-shell">
    <header class="dash-top">
      <div class="dash-top__brand">
        IBVAP <small>v1.4 / BOP-7</small>
      </div>
      <div class="nav-links">
        <a href="/operator" class="nav-btn primary">⊞ OPERATOR CONSOLE</a>
        <a href="/admin" class="nav-btn">⚙ ADMIN</a>
        <a href="/auditor" class="nav-btn">⚖ AUDITOR VAULT</a>
      </div>
      <div class="dash-top__user">
        <span id="user-name">&mdash;</span>
        <span class="pill" id="user-role">role</span>
        <button class="btn btn--ghost" id="logout-btn" style="width:auto;padding:4px 10px;font-size:11px;">Logout</button>
      </div>
    </header>

    <div class="dash-body">
      <!-- HERO: Live Engine Video Stream -->
      <section class="video-hero">
        <div class="video-hero__head">
          <div class="video-hero__title">
            <span class="dot dot--ok"></span>
            <span>IBVAP LIVE ENGINE PERCEPTION VIDEO &mdash; UNIFIED 6-SPLIT TACTICAL C2 GRID</span>
          </div>
          <div style="display:flex;gap:12px;align-items:center;color:var(--dim);">
            <span id="engine-fps">AI: ACTIVE</span>
            <span>1440&times;720</span>
            <span class="chip chip--crit" id="threat-indicator"><span class="dot dot--crit"></span>NORMAL</span>
          </div>
        </div>
        <div class="video-hero__frame">
          <img id="engine-live-stream" alt="IBVAP Live Engine Video Feed" src="/static/fonts/loading.gif" />
        </div>
      </section>

      <!-- Sub-row: Individual Camera Tile States -->
      <div class="cams-row" id="cams-row"></div>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    if (!window.ibvap_auth.ensureAuthed()) {
      // Redirected by auth.js
    } else {
      const u = window.ibvap_auth.user();
      if (u && u.role) {
        const target = {
          admin: '/admin',
          operator: '/operator',
          auditor: '/auditor',
        }[u.role] || '/operator';
        window.location.replace(target);
      }
      const tok = window.ibvap_auth.token();
      document.getElementById('user-name').textContent = (u && u.display_name) || (u && u.username) || '—';
      document.getElementById('user-role').textContent = (u && u.role) || '—';

      document.getElementById('logout-btn').addEventListener('click', () => {
        window.ibvap_auth.logout('logout');
      });

      // Connect the hero image to the live GRID stream from engine.py
      const streamImg = document.getElementById('engine-live-stream');
      if (tok) {
        streamImg.src = `/api/stream/GRID?token=${encodeURIComponent(tok)}`;
        streamImg.onerror = () => {
          setTimeout(() => {
            const currentTok = window.ibvap_auth.token() || tok;
            if (currentTok) streamImg.src = `/api/stream/GRID?token=${encodeURIComponent(currentTok)}&_retry=${Date.now()}`;
          }, 1500);
        };
      }

      const camsRow = document.getElementById('cams-row');
      const threatInd = document.getElementById('threat-indicator');
      const fpsInd = document.getElementById('engine-fps');

      function threatChip(level) {
        const cls = level === 'CRITICAL' ? 'crit' : (level === 'WARNING' ? 'warn' : 'ok');
        return '<span class="chip chip--' + cls + '"><span class="dot dot--' + cls + '"></span>' + level + '</span>';
      }

      const camMap = {
        'CAM-01 (People)': 'CAM-01',
        'CAM-02 (Vehicles & ANPR)': 'CAM-02',
        'CAM-03 (Night CCTV)': 'CAM-03',
        'CAM-04 (Thermal FLIR)': 'CAM-04',
        'CAM-05 (Face Recognition)': 'CAM-05',
      };

      async function poll() {
        try {
          const res = await window.ibvap_auth.fetchAuthed('/api/state');
          const data = await res.json();
          const cams = Object.keys(data);
          let maxThreat = 'NORMAL';

          camsRow.innerHTML = cams.map(name => {
            const s = data[name];
            const tracks = (s.tracks || []).length;
            const plates = (s.plates || []).length;
            const faces  = (s.faces || []).length;
            const night  = s.night ? 'NIGHT' : 'DAY';
            const fps    = (typeof s.fps === 'number') ? s.fps.toFixed(1) : '5.0';
            const camId  = camMap[name] || 'CAM-01';
            const snapUrl = `/api/stream/${camId}?token=${encodeURIComponent(tok)}`;

            if (s.threat_level === 'CRITICAL') maxThreat = 'CRITICAL';
            else if (s.threat_level === 'WARNING' && maxThreat !== 'CRITICAL') maxThreat = 'WARNING';

            return `
              <div class="cam-card">
                <div class="cam-card__head">
                  <span>${name}</span>
                  ${threatChip(s.threat_level || 'NORMAL')}
                </div>
                <div class="cam-card__img-wrap">
                  <img src="${snapUrl}" alt="${name}" onerror="this.src='/snapshots/cam1_live.jpg'" />
                </div>
                <div class="cam-card__stats">
                  <div class="cam-card__stat"><span class="lbl">FPS</span><span class="val">${fps}</span></div>
                  <div class="cam-card__stat"><span class="lbl">MODE</span><span class="val">${night}</span></div>
                  <div class="cam-card__stat"><span class="lbl">TRK</span><span class="val">${tracks}</span></div>
                  <div class="cam-card__stat"><span class="lbl">PLATE</span><span class="val">${plates}</span></div>
                  <div class="cam-card__stat"><span class="lbl">FACE</span><span class="val">${faces}</span></div>
                  <div class="cam-card__stat"><span class="lbl">STATUS</span><span class="val" style="color:var(--ok)">${s.tamper && s.tamper.tampered ? 'TAMPER' : 'SECURE'}</span></div>
                </div>
              </div>
            `;
          }).join('');

          threatInd.className = 'chip chip--' + (maxThreat === 'CRITICAL' ? 'crit' : (maxThreat === 'WARNING' ? 'warn' : 'ok'));
          threatInd.innerHTML = '<span class="dot dot--' + (maxThreat === 'CRITICAL' ? 'crit' : (maxThreat === 'WARNING' ? 'warn' : 'ok')) + '"></span>' + maxThreat;
        } catch (e) {
          // ignore transient poll errors
        }
      }

      poll();
      setInterval(poll, 2000);
    }
  </script>
</body>
</html>
